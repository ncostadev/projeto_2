{% extends 'pages/base.html' %}
{% load static %}

{% block content %}

    <div class="container py-5">
        <div class="row justify-content-center" >
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    
                    <form method="post">
                        {% csrf_token %}
        
                        <div class="mb-3">
                            <label class="form-label">Paciente</label>
                            <input type="text" name="paciente" class="form-control" value="{{ form.paciente.value|default:'' }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Médico</label>
                            <input type="text" name="medico" class="form-control" value="{{ form.medico.value|default:'' }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Especialidade</label>
                            <input type="text" name="especialidade" class="form-control" value="{{ form.especialidade.value|default:'' }}" required>
                        </div>
                        

                        <div class="mb-3">
                            <label class="form-label">Data</label>
                            <input type="date" name="data" class="form-control" value="{{ form.data.value|default:'Y-m-d' }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Horário</label>
                            <input type="time" name="horario" class="form-control" value="{{ form.horario.value|default:'H:i' }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Status</label>

                            <select name="status" class="form-select" required>
                                <option value="Pendente"
                                    {% if form.status.value == "Pendente" %}selected{% endif %}>
                                    Pendente
                                </option>

                                <option value="Realizada"
                                    {% if form.status.value == "Realizada" %}selected{% endif %}>
                                    Realizada
                                </option>

                                <option value="Cancelada"
                                    {% if form.status.value == "Cancelada" %}selected{% endif %}>
                                    Cancelada
                                </option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Cadastrar consulta
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    

{% endblock %}
